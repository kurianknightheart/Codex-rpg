<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ashen Marches — Knight of the Mire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="title-block">
        <h1>Ashen Marches</h1>
        <p>Young Knight Expedition</p>
      </div>
      <div class="hud__stats" id="coreStats"></div>
      <div class="hud__resources" id="resourceBars"></div>
    </header>

    <section class="main-grid">
      <div class="world" id="world">
        <div class="player" id="player" aria-label="young knight"></div>
      </div>

      <aside class="panel">
        <h2 id="panelTitle">Field Notes</h2>
        <p id="panelText">Tap stat pills to learn what each attribute changes.</p>

        <section class="equipment">
          <h3>Equipped</h3>
          <div id="equipmentSlots" class="equipment-slots"></div>
        </section>

        <section class="inventory-section">
          <h3>Inventory</h3>
          <div id="inventory" class="inventory"></div>
        </section>

        <section class="actions" id="actions"></section>
      </aside>
    </section>

    <section class="controls">
      <div class="joystick" id="joystick">
        <div class="joystick-base"></div>
        <div class="joystick-knob" id="joystickKnob"></div>
      </div>
      <div class="encounter" id="encounterPanel">No immediate threats.</div>
    </section>

    <footer class="log" id="log" aria-live="polite"></footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
