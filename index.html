<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ashen Marches</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="hud-top">
        <h1>Ashen Marches</h1>
        <div class="save-controls">
          <button id="saveBtn">Save</button>
          <button id="loadBtn">Load</button>
        </div>
      </div>
      <div id="coreStats" class="hud-grid"></div>
      <div id="resourceBars" class="hud-grid"></div>
    </header>

    <section id="screen-map" class="screen active">
      <div class="world-wrap">
        <div class="world" id="world">
          <div class="player" id="player"></div>
        </div>
        <div id="combatOverlay" class="combat-overlay hidden" aria-live="polite">
          <div class="combat-stage">
            <div class="combat-lane left" id="combatPlayerLane">
              <div class="combat-name">Knight Errant</div>
              <div id="combatPlayerSprite" class="combat-sprite player-side"></div>
              <div id="combatPlayerDamage" class="damage-layer"></div>
            </div>
            <div class="combat-vs">VS</div>
            <div class="combat-lane right" id="combatMonsterLane">
              <div id="combatMonsterName" class="combat-name">Monster</div>
              <div id="combatMonsterSprite" class="combat-sprite monster-side"></div>
              <div id="combatMonsterDamage" class="damage-layer"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="controls-row">
        <div id="encounterPanel" class="encounter">Tap any nearby tile to move there.</div>
      </div>
      <div class="actions" id="actions"></div>
    </section>

    <section id="screen-character" class="screen">
      <div class="character-card">
        <div id="characterPreview" class="character-preview"></div>
        <div id="characterDetails" class="character-details"></div>
      </div>
    </section>

    <section id="screen-inventory" class="screen">
      <div class="inv-layout">
        <div>
          <h3>Equipment</h3>
          <div id="equipmentSlots" class="equipment-slots"></div>
        </div>
        <div>
          <h3>Inventory</h3>
          <div id="inventory" class="inventory"></div>
        </div>
      </div>
    </section>

    <footer class="bottom-nav" id="bottomNav">
      <button data-screen="map" class="nav-btn active">Map</button>
      <button data-screen="character" class="nav-btn">Character</button>
      <button data-screen="inventory" class="nav-btn">Inventory</button>
    </footer>

    <footer id="log" class="log"></footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
